<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <meta name="robots" content="index,follow" />
  <meta name="description" content="ParasiteDX — plataforma de apoio informacional e pesquisa em parasitologia da Databiomics." />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>ParasiteDX | Databiomics</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --panel: #0d1728;
      --text: #eaf2ff;
      --muted: #9fb0c8;
      --accent: #5dd6c0;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #shell {
      position: fixed;
      inset: 0;
      background: var(--bg);
    }

    #parasitedx-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(93,214,192,.11), transparent 34%),
        var(--bg);
      transition: opacity .25s ease, visibility .25s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(92vw, 420px);
      padding: 28px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      background: rgba(13,23,40,.86);
      box-shadow: 0 22px 70px rgba(0,0,0,.34);
      text-align: center;
    }

    .brand {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -.04em;
      font-weight: 800;
    }

    .brand span { color: var(--accent); }
    .subtitle { margin: 0; color: var(--muted); line-height: 1.5; }

    .pulse {
      width: 36px;
      height: 36px;
      margin: 24px auto 0;
      border: 3px solid rgba(93,214,192,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    noscript {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }
  </style>
</head>
<body>
  <main id="shell" aria-label="ParasiteDX">
    <section id="loading" aria-live="polite" aria-label="Carregando ParasiteDX">
      <div class="loader-card">
        <h1 class="brand">Parasite<span>DX</span></h1>
        <p class="subtitle">Databiomics · carregando ambiente seguro…</p>
        <div class="pulse" aria-hidden="true"></div>
      </div>
    </section>

    <iframe
      id="parasitedx-frame"
      title="ParasiteDX"
      src="https://parasitedx.streamlit.app/?embed=true"
      allow="microphone; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager"
      allowfullscreen></iframe>
  </main>

  <noscript>O ParasiteDX precisa de JavaScript habilitado para funcionar.</noscript>

  <script>
    const frame = document.getElementById('parasitedx-frame');
    const loading = document.getElementById('loading');

    frame.addEventListener('load', () => {
      loading.classList.add('hidden');
    }, { once: true });

    window.setTimeout(() => loading.classList.add('hidden'), 15000);
  </script>
</body>
</html>
